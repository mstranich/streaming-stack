name: servarr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-3}

x-service-hardening: &service-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  init-data:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
    working_dir: /workspace
    command: ["python", "scripts/init-data-dirs.py"]
    restart: "no"
    network_mode: none
    read_only: true
    volumes:
      - type: bind
        source: ./scripts
        target: /workspace/scripts
        read_only: true
      - type: bind
        source: ./data
        target: /workspace/data

  transmission:
    <<: *service-hardening
    image: ${TRANSMISSION_IMAGE:-lscr.io/linuxserver/transmission:version-4.1.3-r0}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      PASS: ${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TRANSMISSION_WEB_PORT:-9091}:9091"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/tcp"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/udp"
    volumes:
      - type: bind
        source: ./config/transmission
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$USER:$$PASS\" http://127.0.0.1:9091/transmission/web/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  prowlarr:
    <<: *service-hardening
    image: ${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:version-2.5.2.5491}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PROWLARR_WEB_PORT:-9696}:9696"
    volumes:
      - type: bind
        source: ./config/prowlarr
        target: /config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  sonarr:
    <<: *service-hardening
    image: ${SONARR_IMAGE:-lscr.io/linuxserver/sonarr:version-4.0.19.2979}
    environment: &servarr-environment
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SONARR_WEB_PORT:-8989}:8989"
    volumes:
      - type: bind
        source: ./config/sonarr
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  radarr:
    <<: *service-hardening
    image: ${RADARR_IMAGE:-lscr.io/linuxserver/radarr:version-6.3.0.10514}
    environment: *servarr-environment
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RADARR_WEB_PORT:-7878}:7878"
    volumes:
      - type: bind
        source: ./config/radarr
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bazarr:
    <<: *service-hardening
    image: ${BAZARR_IMAGE:-lscr.io/linuxserver/bazarr:version-v1.6.0}
    environment: *servarr-environment
    depends_on:
      init-data:
        condition: service_completed_successfully
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BAZARR_WEB_PORT:-6767}:6767"
    volumes:
      - type: bind
        source: ./config/bazarr
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  configure-stack:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    working_dir: /workspace
    command: ["python", "scripts/configure-stack.py"]
    environment:
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_CONFIG: /config/prowlarr/config.xml
      SONARR_URL: http://sonarr:8989
      SONARR_CONFIG: /config/sonarr/config.xml
      RADARR_URL: http://radarr:7878
      RADARR_CONFIG: /config/radarr/config.xml
      BAZARR_URL: http://bazarr:6767
      BAZARR_CONFIG: /config/bazarr/config/config.yaml
      JELLYFIN_HOST: ${JELLYFIN_HOST:-host.docker.internal}
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      SERVARR_USER: ${SERVARR_USER:?Set SERVARR_USER in .env}
      SERVARR_PASS: ${SERVARR_PASS:?Set SERVARR_PASS in .env}
      SERVARR_UI_LANGUAGE: ${SERVARR_UI_LANGUAGE:-es_MX}
      TRANSMISSION_INTERNAL_HOST: transmission
      TRANSMISSION_INTERNAL_PORT: 9091
      TRANSMISSION_URL: http://transmission:9091
      TRANSMISSION_URL_BASE: /transmission/
      TRANSMISSION_USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      TRANSMISSION_PASS: ${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
    depends_on:
      prowlarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      bazarr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    read_only: true
    volumes:
      - type: bind
        source: ./scripts
        target: /workspace/scripts
        read_only: true
      - type: bind
        source: ./config/prowlarr
        target: /config/prowlarr
        read_only: true
      - type: bind
        source: ./config/sonarr
        target: /config/sonarr
        read_only: true
      - type: bind
        source: ./config/radarr
        target: /config/radarr
        read_only: true
      - type: bind
        source: ./config/bazarr
        target: /config/bazarr
        read_only: true
    restart: "no"

  diagnose-stack:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["ops"]
    working_dir: /workspace
    command: ["python", "scripts/diagnose-stack.py"]
    environment:
      TRANSMISSION_USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      TRANSMISSION_PASS: ${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
      JELLYFIN_HOST: ${JELLYFIN_HOST:-host.docker.internal}
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      MIN_FREE_SPACE_GB: ${MIN_FREE_SPACE_GB:-20}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./data:/data:ro
    restart: "no"

  backup-config:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["ops"]
    working_dir: /workspace
    command: ["python", "scripts/backup-config.py"]
    read_only: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config:/source/config:ro
      - ./.env:/source/.env:ro
      - ./backups:/backups
    restart: "no"

  restore-config:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["ops"]
    working_dir: /workspace
    command: ["python", "scripts/restore-config.py"]
    environment:
      RESTORE_ARCHIVE: ${RESTORE_ARCHIVE:-}
    read_only: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./backups:/backups:ro
      - ./config:/restore/config
      - ./.env:/restore/.env
    restart: "no"
