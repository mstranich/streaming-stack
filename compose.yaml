name: servarr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-3}

x-service-hardening: &service-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

# Docker Engine runs inside the managed WSL 2 distribution.  Services that
# call applications published by Windows resolve the address selected by the
# manager at startup through Docker's standard host-gateway mechanism.
x-windows-host: &windows-host
  - "host.docker.internal:host-gateway"

services:
  init-data:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
    working_dir: /workspace
    command: ["python", "scripts/init-data-dirs.py"]
    restart: "no"
    network_mode: none
    read_only: true
    volumes:
      - type: bind
        source: ./scripts
        target: /workspace/scripts
        read_only: true
      - type: bind
        source: ./data
        target: /workspace/data

  transmission:
    <<: *service-hardening
    image: ${TRANSMISSION_IMAGE:-lscr.io/linuxserver/transmission:version-4.1.3-r0}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      PASS: ${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TRANSMISSION_WEB_PORT:-9091}:9091"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/tcp"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/udp"
    volumes:
      - type: bind
        source: ./config/transmission
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$USER:$$PASS\" http://127.0.0.1:9091/transmission/web/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  init-jackett:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    environment:
      JACKETT_FLARESOLVERR_URL: http://flaresolverr:8191
      JACKETT_FLARESOLVERR_MAX_TIMEOUT: ${JACKETT_FLARESOLVERR_MAX_TIMEOUT:-60000}
    working_dir: /workspace
    command: ["python", "scripts/init-jackett-config.py"]
    restart: "no"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./scripts
        target: /workspace/scripts
        read_only: true
      - type: bind
        source: ./config/jackett
        target: /config/jackett

  prowlarr:
    <<: *service-hardening
    image: ${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:version-2.5.2.5491}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PROWLARR_WEB_PORT:-9696}:9696"
    volumes:
      - type: bind
        source: ./config/prowlarr
        target: /config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  jackett:
    <<: *service-hardening
    image: ${JACKETT_IMAGE:-lscr.io/linuxserver/jackett:version-v0.24.2489}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      AUTO_UPDATE: "false"
    depends_on:
      init-jackett:
        condition: service_completed_successfully
      flaresolverr:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JACKETT_WEB_PORT:-9117}:9117"
    volumes:
      - type: bind
        source: ./config/jackett
        target: /config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9117/UI/Dashboard >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  flaresolverr:
    <<: *service-hardening
    image: ${FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:v3.5.0}
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      LOG_HTML: ${FLARESOLVERR_LOG_HTML:-false}
      CAPTCHA_SOLVER: none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sonarr:
    <<: *service-hardening
    image: ${SONARR_IMAGE:-lscr.io/linuxserver/sonarr:version-4.0.19.2979}
    environment: &servarr-environment
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SONARR_WEB_PORT:-8989}:8989"
    volumes:
      - type: bind
        source: ./config/sonarr
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  radarr:
    <<: *service-hardening
    image: ${RADARR_IMAGE:-lscr.io/linuxserver/radarr:version-6.3.0.10514}
    environment: *servarr-environment
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RADARR_WEB_PORT:-7878}:7878"
    volumes:
      - type: bind
        source: ./config/radarr
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bazarr:
    <<: *service-hardening
    image: ${BAZARR_IMAGE:-lscr.io/linuxserver/bazarr:version-v1.6.0}
    environment: *servarr-environment
    extra_hosts: *windows-host
    depends_on:
      init-data:
        condition: service_completed_successfully
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BAZARR_WEB_PORT:-6767}:6767"
    volumes:
      - type: bind
        source: ./config/bazarr
        target: /config
      - type: bind
        source: ./data
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  seerr:
    <<: *service-hardening
    image: ${SEERR_IMAGE:-ghcr.io/seerr-team/seerr:v3.4.1}
    init: true
    extra_hosts: *windows-host
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      PORT: 5055
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
      API_KEY: ${SEERR_API_KEY:?Set SEERR_API_KEY in .env}
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SEERR_WEB_PORT:-5055}:5055"
    volumes:
      - type: bind
        source: ./config/seerr
        target: /app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  configure-stack:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    working_dir: /workspace
    command: ["python", "scripts/configure-stack.py"]
    extra_hosts: *windows-host
    environment:
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_CONFIG: /config/prowlarr/config.xml
      JACKETT_URL: http://jackett:9117
      JACKETT_CONFIG: /config/jackett/Jackett/ServerConfig.json
      JACKETT_SYNC_INDEXERS: ${JACKETT_SYNC_INDEXERS:-}
      JACKETT_PROWLARR_TAG: ${JACKETT_PROWLARR_TAG:-jackett}
      JACKETT_PROWLARR_APP_PROFILE: ${JACKETT_PROWLARR_APP_PROFILE:-}
      JACKETT_INDEXER_TEST_TIMEOUT: ${JACKETT_INDEXER_TEST_TIMEOUT:-120}
      FLARESOLVERR_URL: http://flaresolverr:8191
      FLARESOLVERR_TAG: ${FLARESOLVERR_TAG:-flaresolver}
      FLARESOLVERR_REQUEST_TIMEOUT: ${FLARESOLVERR_REQUEST_TIMEOUT:-60}
      SONARR_URL: http://sonarr:8989
      SONARR_CONFIG: /config/sonarr/config.xml
      RADARR_URL: http://radarr:7878
      RADARR_CONFIG: /config/radarr/config.xml
      BAZARR_URL: http://bazarr:6767
      BAZARR_CONFIG: /config/bazarr/config/config.yaml
      BAZARR_LANGUAGE_PROFILE_NAME: ${BAZARR_LANGUAGE_PROFILE_NAME:-Español}
      BAZARR_LANGUAGES: ${BAZARR_LANGUAGES:-es,en}
      BAZARR_LANGUAGE_CUTOFF: ${BAZARR_LANGUAGE_CUTOFF:-es}
      BAZARR_LANGUAGE_FORCED: ${BAZARR_LANGUAGE_FORCED:-false}
      BAZARR_LANGUAGE_HI: ${BAZARR_LANGUAGE_HI:-false}
      BAZARR_LANGUAGE_EXCLUDE_AUDIO: ${BAZARR_LANGUAGE_EXCLUDE_AUDIO:-false}
      BAZARR_LANGUAGE_ONLY_IF_AUDIO: ${BAZARR_LANGUAGE_ONLY_IF_AUDIO:-false}
      BAZARR_APPLY_PROFILE_TO_SERIES: ${BAZARR_APPLY_PROFILE_TO_SERIES:-true}
      BAZARR_APPLY_PROFILE_TO_MOVIES: ${BAZARR_APPLY_PROFILE_TO_MOVIES:-true}
      BAZARR_APPLY_PROFILE_TO_EXISTING: ${BAZARR_APPLY_PROFILE_TO_EXISTING:-true}
      SEERR_URL: http://seerr:5055
      SEERR_API_KEY: ${SEERR_API_KEY:?Set SEERR_API_KEY in .env}
      SEERR_UI_LANGUAGE: ${SEERR_UI_LANGUAGE:-es}
      SEERR_APPLICATION_TITLE: ${SEERR_APPLICATION_TITLE:-Seerr}
      SEERR_JELLYFIN_INTERNAL_URL: ${SEERR_JELLYFIN_INTERNAL_URL:-http://host.docker.internal:8096}
      SEERR_JELLYFIN_EXTERNAL_URL: ${SEERR_JELLYFIN_EXTERNAL_URL:-http://192.168.1.2:8096}
      SEERR_RADARR_PROFILE: ${SEERR_RADARR_PROFILE:-}
      SEERR_SONARR_PROFILE: ${SEERR_SONARR_PROFILE:-}
      SEERR_TELEGRAM_BOT_TOKEN: ${SEERR_TELEGRAM_BOT_TOKEN:-}
      SEERR_TELEGRAM_CHAT_ID: ${SEERR_TELEGRAM_CHAT_ID:-}
      SEERR_TELEGRAM_TYPES: ${SEERR_TELEGRAM_TYPES:-0}
      SEERR_TELEGRAM_MESSAGE_THREAD_ID: ${SEERR_TELEGRAM_MESSAGE_THREAD_ID:-}
      SEERR_TELEGRAM_SEND_SILENTLY: ${SEERR_TELEGRAM_SEND_SILENTLY:-false}
      SEERR_TELEGRAM_EMBED_POSTER: ${SEERR_TELEGRAM_EMBED_POSTER:-true}
      JELLYFIN_HOST: ${JELLYFIN_HOST:-host.docker.internal}
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      SERVARR_USER: ${SERVARR_USER:?Set SERVARR_USER in .env}
      SERVARR_PASS: ${SERVARR_PASS:?Set SERVARR_PASS in .env}
      SERVARR_UI_LANGUAGE: ${SERVARR_UI_LANGUAGE:-es_MX}
      TRANSMISSION_INTERNAL_HOST: transmission
      TRANSMISSION_INTERNAL_PORT: 9091
      TRANSMISSION_URL: http://transmission:9091
      TRANSMISSION_URL_BASE: /transmission/
      TRANSMISSION_USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      TRANSMISSION_PASS: ${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
      TRANSMISSION_SEED_RATIO: ${TRANSMISSION_SEED_RATIO:-2}
      TRANSMISSION_WORK_SCHEDULE_ENABLED: ${TRANSMISSION_WORK_SCHEDULE_ENABLED:-true}
      TRANSMISSION_WORK_DAYS: ${TRANSMISSION_WORK_DAYS:-mon,tue,wed,thu,fri}
      TRANSMISSION_WORK_START: ${TRANSMISSION_WORK_START:-09:00}
      TRANSMISSION_WORK_END: ${TRANSMISSION_WORK_END:-18:00}
      TRANSMISSION_WORK_DOWN_KBPS: ${TRANSMISSION_WORK_DOWN_KBPS:-512}
      TRANSMISSION_WORK_UP_KBPS: ${TRANSMISSION_WORK_UP_KBPS:-128}
    depends_on:
      prowlarr:
        condition: service_healthy
      jackett:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      bazarr:
        condition: service_healthy
      seerr:
        condition: service_healthy
      transmission:
        condition: service_healthy
    read_only: true
    volumes:
      - type: bind
        source: ./scripts
        target: /workspace/scripts
        read_only: true
      - type: bind
        source: ./config/prowlarr
        target: /config/prowlarr
        read_only: true
      - type: bind
        source: ./config/jackett
        target: /config/jackett
        read_only: true
      - type: bind
        source: ./config/sonarr
        target: /config/sonarr
        read_only: true
      - type: bind
        source: ./config/radarr
        target: /config/radarr
        read_only: true
      - type: bind
        source: ./config/bazarr
        target: /config/bazarr
        read_only: true
    restart: "no"

  configure-seerr:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["setup"]
    working_dir: /workspace
    command: ["python", "scripts/configure-stack.py", "--only", "seerr"]
    extra_hosts: *windows-host
    environment:
      SEERR_URL: http://seerr:5055
      SEERR_API_KEY: ${SEERR_API_KEY:?Set SEERR_API_KEY in .env}
      SEERR_UI_LANGUAGE: ${SEERR_UI_LANGUAGE:-es}
      SEERR_APPLICATION_TITLE: ${SEERR_APPLICATION_TITLE:-Seerr}
      SEERR_JELLYFIN_INTERNAL_URL: ${SEERR_JELLYFIN_INTERNAL_URL:-http://host.docker.internal:8096}
      SEERR_JELLYFIN_EXTERNAL_URL: ${SEERR_JELLYFIN_EXTERNAL_URL:-http://192.168.1.2:8096}
      SEERR_RADARR_PROFILE: ${SEERR_RADARR_PROFILE:-}
      SEERR_SONARR_PROFILE: ${SEERR_SONARR_PROFILE:-}
      SEERR_TELEGRAM_BOT_TOKEN: ${SEERR_TELEGRAM_BOT_TOKEN:-}
      SEERR_TELEGRAM_CHAT_ID: ${SEERR_TELEGRAM_CHAT_ID:-}
      SEERR_TELEGRAM_TYPES: ${SEERR_TELEGRAM_TYPES:-0}
      SEERR_TELEGRAM_MESSAGE_THREAD_ID: ${SEERR_TELEGRAM_MESSAGE_THREAD_ID:-}
      SEERR_TELEGRAM_SEND_SILENTLY: ${SEERR_TELEGRAM_SEND_SILENTLY:-false}
      SEERR_TELEGRAM_EMBED_POSTER: ${SEERR_TELEGRAM_EMBED_POSTER:-true}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      SONARR_URL: http://sonarr:8989
      SONARR_CONFIG: /config/sonarr/config.xml
      RADARR_URL: http://radarr:7878
      RADARR_CONFIG: /config/radarr/config.xml
    depends_on:
      seerr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config/sonarr:/config/sonarr:ro
      - ./config/radarr:/config/radarr:ro
    restart: "no"

  configure-jackett:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["setup"]
    working_dir: /workspace
    command: ["python", "scripts/configure-stack.py", "--only", "jackett"]
    environment:
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_CONFIG: /config/prowlarr/config.xml
      JACKETT_URL: http://jackett:9117
      JACKETT_CONFIG: /config/jackett/Jackett/ServerConfig.json
      JACKETT_SYNC_INDEXERS: ${JACKETT_SYNC_INDEXERS:-}
      JACKETT_PROWLARR_TAG: ${JACKETT_PROWLARR_TAG:-jackett}
      JACKETT_PROWLARR_APP_PROFILE: ${JACKETT_PROWLARR_APP_PROFILE:-}
      JACKETT_INDEXER_TEST_TIMEOUT: ${JACKETT_INDEXER_TEST_TIMEOUT:-120}
    depends_on:
      prowlarr:
        condition: service_healthy
      jackett:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config/prowlarr:/config/prowlarr:ro
      - ./config/jackett:/config/jackett:ro
    restart: "no"

  diagnose-stack:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["ops"]
    working_dir: /workspace
    command: ["python", "scripts/diagnose-stack.py"]
    extra_hosts: *windows-host
    environment:
      TRANSMISSION_USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      TRANSMISSION_PASS: ${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
      JELLYFIN_HOST: ${JELLYFIN_HOST:-host.docker.internal}
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      MIN_FREE_SPACE_GB: ${MIN_FREE_SPACE_GB:-20}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./data:/data:ro
    restart: "no"

  backup-config:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["ops"]
    working_dir: /workspace
    command: ["python", "scripts/backup-config.py"]
    read_only: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config:/source/config:ro
      - ./.env:/source/.env:ro
      - ./backups:/backups
    restart: "no"

  restore-config:
    image: ${PYTHON_IMAGE:-python:3.13.15-alpine3.24}
    profiles: ["ops"]
    working_dir: /workspace
    command: ["python", "scripts/restore-config.py"]
    environment:
      RESTORE_ARCHIVE: ${RESTORE_ARCHIVE:-}
    read_only: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./backups:/backups:ro
      - ./config:/restore/config
      - ./.env:/restore/.env
    restart: "no"
