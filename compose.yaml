name: servarr

services:
  init-data:
    image: bash:5.3.3
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
    working_dir: /workspace
    command: ["bash", "scripts/init-data-dirs.sh"]
    restart: "no"
    network_mode: none
    read_only: true
    volumes:
      - type: bind
        source: ./scripts
        target: /workspace/scripts
        read_only: true
      - type: bind
        source: ./data
        target: /workspace/data

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      USER: ${TRANSMISSION_USER:?Set TRANSMISSION_USER in .env}
      PASS: ${TRANSMISSION_PASS:?Set TRANSMISSION_PASS in .env}
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TRANSMISSION_WEB_PORT:-9091}:9091"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/tcp"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/udp"
    volumes:
      - type: bind
        source: ./config/transmission
        target: /config
      - type: bind
        source: ./data
        target: /data
    restart: unless-stopped
